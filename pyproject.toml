[project]
name = "logicbroker-agent"
version = "0.1.0"
description = "RAG-based customer support agent for Logicbroker"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "html2text>=2024.2.26",
    "networkx>=3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
logicbroker-agent = "logicbroker_agent.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "eval: RAG pipeline evaluation tests (require ANTHROPIC_API_KEY, slow)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
